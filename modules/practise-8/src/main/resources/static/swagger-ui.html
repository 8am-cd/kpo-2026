<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Практика 8 — Swagger UI</title>
  <script>
    const applicationOrigin = "http://localhost:8080";
    // Открываем UI с сервера приложения, включая запуск HTML из IntelliJ.
    // Тогда спецификация и Try it out используют один origin без CORS.
    if (window.location.origin !== applicationOrigin) {
      window.location.replace(applicationOrigin + "/swagger-ui.html");
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
  <p id="loading">Загрузка Swagger UI требует доступа к CDN.
    <a href="http://localhost:8080/openapi.yaml">Скачать OpenAPI-спецификацию</a>.
  </p>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    if (window.location.origin === applicationOrigin
        && typeof SwaggerUIBundle === "function") {
      SwaggerUIBundle({
        url: applicationOrigin + "/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        validatorUrl: null,
        presets: [SwaggerUIBundle.presets.apis]
      });
      document.getElementById("loading").hidden = true;
    }
  </script>
</body>
</html>
